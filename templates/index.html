<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng vẽ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:13px system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pen,.ruler,.rect,.ell,.arrow,.bucket,.chroma{cursor:crosshair}.text{cursor:text}.eraser{cursor:cell}.zoom{cursor:zoom-in}.select{cursor:default}
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);max-width:calc(100% - 16px);display:flex;gap:3px;align-items:center;padding:6px;background:#1d2433;color:#e8ecf4;border-radius:14px;box-shadow:0 8px 30px #0003;overflow-x:auto}
#tools{display:contents}
.b{border:0;background:none;color:inherit;padding:5px 7px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:46px;font:inherit;flex:none}
.b i{font-style:normal;font-size:17px;line-height:1.15}.b span{font-size:10.5px;opacity:.75;white-space:nowrap}
.b:hover{background:#2b3449}.b.on{background:#3b6cf6;color:#fff}.b.on span{opacity:1}
.b:focus-visible,input:focus-visible{outline:2px solid #8fb0ff;outline-offset:1px}
.sep{width:1px;height:30px;background:#3a4560;margin:0 4px;flex:none}
.g{display:flex;align-items:center;gap:4px;flex:none}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid #fff3;cursor:pointer;padding:0;flex:none}.sw.on{border-color:#fff}
input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer}
label.s{display:flex;flex-direction:column;font-size:10.5px;opacity:.85;gap:2px}
input[type=range]{width:78px;margin:0}
#hint{position:fixed;top:12px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);padding:7px 14px;background:#1d2433;color:#e8ecf4;border-radius:999px;font-size:12.5px;text-align:center;pointer-events:none;box-shadow:0 4px 16px #0002}
#hint.flash{background:#3b6cf6}
textarea.te{position:fixed;z-index:5;border:1.5px dashed #3b6cf6;background:#fff8;outline:0;resize:none;padding:0;margin:0;overflow:hidden;min-width:40px;line-height:1.25;field-sizing:content;white-space:pre}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<div id="bar">
  <div id="tools" class="g"></div>
  <div class="sep"></div>
  <div class="g" id="sws"></div>
  <input type="color" id="col" value="#111827" title="Chọn màu (dùng cho nét, chữ và sơn)">
  <label class="s">Cỡ nét<input type="range" id="sz" min="1" max="40" value="4"></label>
  <label class="s">Dung sai<input type="range" id="tl" min="0" max="100" value="40"></label>
  <div class="sep"></div>
  <div class="g">
    <button class="b" id="zo" title="Thu nhỏ"><i>−</i><span>Thu nhỏ</span></button>
    <button class="b" id="zl" title="Về 100%"><i>100%</i><span>Mức zoom</span></button>
    <button class="b" id="zi" title="Phóng to"><i>+</i><span>Phóng to</span></button>
    <button class="b" id="fit" title="Xem toàn bộ sơ đồ (F)"><i>⤢</i><span>Vừa khung</span></button>
  </div>
  <div class="sep"></div>
  <div class="g">
    <button class="b" id="un" title="Ctrl+Z"><i>↶</i><span>Hoàn tác</span></button>
    <button class="b" id="re" title="Ctrl+Y"><i>↷</i><span>Làm lại</span></button>
    <button class="b" id="gr" title="Bật/tắt lưới (G)"><i>▦</i><span>Lưới</span></button>
    <button class="b" id="sv" title="Lưu ảnh PNG (Ctrl+S)"><i>💾</i><span>Lưu PNG</span></button>
    <button class="b" id="cl" title="Xóa toàn bộ bảng"><i>🗑</i><span>Xóa hết</span></button>
  </div>
</div>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d'),hint=$('#hint');
const TOOLS=[
['pen','✏️','Bút','Bút (P) — giữ chuột và vẽ. Ctrl+V để dán ảnh từ clipboard.'],
['ruler','📏','Thước','Thước (L) — kéo để kẻ đường thẳng, tự khóa góc 15°; giữ Shift để ép góc.'],
['rect','▭','Chữ nhật','Hình chữ nhật (R) — kéo để vẽ.'],
['ell','◯','Elip','Elip (O) — kéo để vẽ.'],
['arrow','➜','Mũi tên','Mũi tên (A) — kéo để vẽ, giữ Shift để ép góc.'],
['eraser','🧽','Tẩy','Tẩy (E) — kéo qua nét nào, nét đó bị xóa.'],
['select','🖱️','Chọn','Chọn (V) — bấm vào nét để kéo đi; kéo ở chỗ trống để xem sơ đồ; Delete để xóa.'],
['text','T','Chữ','Chữ (T) — bấm vào đâu gõ chữ ở đó. Enter để xong, Shift+Enter xuống dòng. Màu chữ lấy từ ô màu.'],
['bucket','🪣','Sơn','Sơn (B) — bấm vào hình/ảnh để đổ màu; bấm chỗ trống để đổi màu nền.'],
['chroma','✨','Tách nền','Tách nền (Shift+T) — bấm vào màu trên ảnh để xóa. Chỉnh “Dung sai” cho vừa.'],
['zoom','🔍','Zoom','Zoom (Z) — bấm để phóng to, Alt+bấm để thu nhỏ. Lăn chuột cũng zoom.']];
const COLORS=['#111827','#e11d48','#f97316','#eab308','#16a34a','#0ea5e9','#6366f1','#ffffff'];
let objs=[],hist=[],redo=[],view={s:1,x:0,y:0},tool='pen',color='#111827',size=4,tol=40,bg='#ffffff',sel=null,cur=null,drag=null,space=0,grid=true,dirty=0,tt,st;
const dpr=Math.min(devicePixelRatio||1,2);

/* ---------- tiện ích ---------- */
const W=e=>({x:(e.clientX-view.x)/view.s,y:(e.clientY-view.y)/view.s});
const rgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const cl=a=>a.map(o=>({...o,pts:o.pts&&o.pts.map(p=>[...p]),a:o.a&&[...o.a],b:o.b&&[...o.b]}));
const snapS=()=>({o:cl(objs),bg});
const rd=()=>{if(!dirty){dirty=1;requestAnimationFrame(()=>{dirty=0;render()})}};
function toast(m){hint.textContent=m;hint.classList.add('flash');clearTimeout(tt);tt=setTimeout(()=>{hint.classList.remove('flash');hint.textContent=TOOLS.find(t=>t[0]==tool)[3]},3500)}
function upd(){$('#zl').firstChild.textContent=Math.round(view.s*100)+'%';rd()}
function push(){hist.push(snapS());if(hist.length>60)hist.shift();redo=[];save()}
function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem('wb',JSON.stringify({bg,objs:objs.map(o=>o.t=='img'?{...o,cv:o.cv.toDataURL()}:o)}))}catch(e){}},700)}
function restore(s){objs=s.o;bg=s.bg;sel=null;save();rd()}
const und=()=>{if(hist.length){redo.push(snapS());restore(hist.pop())}};
const rdo=()=>{if(redo.length){hist.push(snapS());restore(redo.pop())}};
function toCv(im){const k=Math.min(1,2000/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c}
function cp(s){const c=document.createElement('canvas');c.width=s.width;c.height=s.height;c.getContext('2d').drawImage(s,0,0);return c}

/* ---------- vẽ đối tượng ---------- */
function drawObj(c,o){
 if(o.hide||(o.t=='img'&&!o.cv))return;
 c.save();c.lineCap=c.lineJoin='round';c.strokeStyle=o.c;c.fillStyle=o.fill||'transparent';c.lineWidth=o.w;
 const t=o.t;
 if(t=='pen'){const p=o.pts;c.beginPath();c.moveTo(p[0][0],p[0][1]);if(p.length==1)c.lineTo(p[0][0]+.01,p[0][1]);
  for(let i=1;i<p.length-1;i++)c.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);
  if(p.length>1)c.lineTo(p[p.length-1][0],p[p.length-1][1]);if(o.fill)c.fill();c.stroke()}
 else if(t=='line'||t=='arrow'){c.beginPath();c.moveTo(...o.a);c.lineTo(...o.b);c.stroke();
  if(t=='arrow'){const an=Math.atan2(o.b[1]-o.a[1],o.b[0]-o.a[0]),h=10+o.w*2;c.beginPath();
   c.moveTo(o.b[0]-h*Math.cos(an-.45),o.b[1]-h*Math.sin(an-.45));c.lineTo(...o.b);c.lineTo(o.b[0]-h*Math.cos(an+.45),o.b[1]-h*Math.sin(an+.45));c.stroke()}}
 else if(t=='rect'){c.beginPath();c.rect(o.a[0],o.a[1],o.b[0]-o.a[0],o.b[1]-o.a[1]);c.fill();c.stroke()}
 else if(t=='ell'){c.beginPath();c.ellipse((o.a[0]+o.b[0])/2,(o.a[1]+o.b[1])/2,Math.abs(o.b[0]-o.a[0])/2,Math.abs(o.b[1]-o.a[1])/2,0,0,7);c.fill();c.stroke()}
 else if(t=='text'){c.font=o.z+'px system-ui,sans-serif';c.fillStyle=o.c;c.textBaseline='top';o.s.split('\n').forEach((l,i)=>c.fillText(l,o.x,o.y+i*o.z*1.25))}
 else if(t=='img')c.drawImage(o.cv,o.x,o.y,o.w,o.h);
 c.restore()}
function bb(o){
 if(o.t=='img')return[o.x,o.y,o.x+o.w,o.y+o.h];
 if(o.t=='text'){ctx.font=o.z+'px system-ui,sans-serif';const L=o.s.split('\n');return[o.x,o.y,o.x+L.reduce((m,l)=>Math.max(m,ctx.measureText(l).width),0),o.y+L.length*o.z*1.25]}
 const P=o.pts||[o.a,o.b];let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of P){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1])}
 const h=(o.w||0)/2;return[a-h,b-h,c+h,d+h]}
function allBB(){let r=null;for(const o of objs){if(o.hide||(o.t=='img'&&!o.cv))continue;const b=bb(o);r=r?[Math.min(r[0],b[0]),Math.min(r[1],b[1]),Math.max(r[2],b[2]),Math.max(r[3],b[3])]:b}return r}
function segd(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p.x-a[0])*dx+(p.y-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a[0]-t*dx,p.y-a[1]-t*dy)}
function hit(o,p,r){
 const w=(o.w||0)/2;
 if(o.t=='pen'){const P=o.pts;if(P.length==1)return Math.hypot(p.x-P[0][0],p.y-P[0][1])<r+w;for(let i=0;i<P.length-1;i++)if(segd(p,P[i],P[i+1])<r+w)return 1;return 0}
 if(o.t=='line'||o.t=='arrow')return segd(p,o.a,o.b)<r+w;
 const[x0,y0,x1,y1]=bb(o),X0=Math.min(x0,x1),X1=Math.max(x0,x1),Y0=Math.min(y0,y1),Y1=Math.max(y0,y1);
 const out=p.x>X0-r&&p.x<X1+r&&p.y>Y0-r&&p.y<Y1+r;
 if(o.t=='img'||o.t=='text'||o.fill)return out;
 return out&&!(p.x>X0+r&&p.x<X1-r&&p.y>Y0+r&&p.y<Y1-r)}
const topHit=(p,r)=>{for(let i=objs.length-1;i>=0;i--)if(!objs[i].hide&&objs[i].cv!==null&&hit(objs[i],p,r))return objs[i]};
function move(o,dx,dy){if(o.pts)o.pts.forEach(q=>{q[0]+=dx;q[1]+=dy});if(o.a){o.a[0]+=dx;o.a[1]+=dy;o.b[0]+=dx;o.b[1]+=dy}if(o.x!=null){o.x+=dx;o.y+=dy}}

function render(){
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=bg;ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(dpr*view.s,0,0,dpr*view.s,view.x*dpr,view.y*dpr);
 if(grid&&view.s>.4){const g=24,e=1.5/view.s;ctx.fillStyle='#0000002e';
  for(let x=Math.floor(-view.x/view.s/g)*g;x<(innerWidth-view.x)/view.s;x+=g)for(let y=Math.floor(-view.y/view.s/g)*g;y<(innerHeight-view.y)/view.s;y+=g)ctx.fillRect(x-e/2,y-e/2,e,e)}
 objs.forEach(o=>drawObj(ctx,o));
 if(cur){drawObj(ctx,cur);if(cur.ruler){const L=Math.round(Math.hypot(cur.b[0]-cur.a[0],cur.b[1]-cur.a[1]));ctx.font=13/view.s+'px system-ui';ctx.fillStyle='#3b6cf6';ctx.fillText(L+' px',(cur.a[0]+cur.b[0])/2+8/view.s,(cur.a[1]+cur.b[1])/2-8/view.s)}}
 if(sel&&objs.includes(sel)&&!sel.hide){const b=bb(sel),p=6/view.s;ctx.strokeStyle='#3b6cf6';ctx.lineWidth=1.5/view.s;ctx.setLineDash([6/view.s,4/view.s]);ctx.strokeRect(b[0]-p,b[1]-p,b[2]-b[0]+2*p,b[3]-b[1]+2*p)}}

/* ---------- công cụ ---------- */
function snap(a,b,force){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),s=Math.PI/12,an=Math.atan2(dy,dx),n=Math.round(an/s)*s;return force||Math.abs(an-n)<.05?[a[0]+L*Math.cos(n),a[1]+L*Math.sin(n)]:b}
function erase(p){const r=Math.max(size,10)/view.s,n=objs.filter(o=>!hit(o,p,r));if(n.length!=objs.length){objs=n;if(sel&&!objs.includes(sel))sel=null}}
function pixelOf(o,p){return[Math.floor((p.x-o.x)/o.w*o.cv.width),Math.floor((p.y-o.y)/o.h*o.cv.height)]}
function bucket(p,r){
 const o=topHit(p,r);push();
 if(!o){bg=color;return}
 if(o.t=='img'){const[x,y]=pixelOf(o,p),c=cp(o.cv),g=c.getContext('2d'),w=c.width,h=c.height,id=g.getImageData(0,0,w,h),d=id.data,i0=(y*w+x)*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]],[R,G,B]=rgb(color),lim=tol*4.4;
  const df=i=>Math.hypot(d[i]-t[0],d[i+1]-t[1],d[i+2]-t[2],d[i+3]-t[3]),seen=new Uint8Array(w*h),stk=[y*w+x];seen[stk[0]]=1;
  const add=(nx,ny)=>{if(nx<0||ny<0||nx>=w||ny>=h)return;const n=ny*w+nx;if(!seen[n]){seen[n]=1;if(df(n*4)<=lim)stk.push(n)}};
  while(stk.length){const k=stk.pop(),i=k*4;d[i]=R;d[i+1]=G;d[i+2]=B;d[i+3]=255;const cx=k%w,cy=k/w|0;add(cx+1,cy);add(cx-1,cy);add(cx,cy+1);add(cx,cy-1)}
  g.putImageData(id,0,0);objs[objs.indexOf(o)]={...o,cv:c};sel=null}
 else if(o.t=='text')o.c=color;else o.fill=color}
function chroma(p){
 const o=[...objs].reverse().find(q=>q.cv&&hit(q,p,0));
 if(!o)return toast('Bấm vào đúng ảnh cần tách nền');
 const[x,y]=pixelOf(o,p),t=o.cv.getContext('2d').getImageData(x,y,1,1).data;
 if(t[3]==0)return toast('Chỗ đó đã trong suốt rồi');
 const c=cp(o.cv),g=c.getContext('2d'),id=g.getImageData(0,0,c.width,c.height),d=id.data,lim=tol*4.41,f=Math.max(8,lim*.3);
 for(let i=0;i<d.length;i+=4){const e=Math.hypot(d[i]-t[0],d[i+1]-t[1],d[i+2]-t[2]);if(e<=lim)d[i+3]=0;else if(e<lim+f)d[i+3]*=(e-lim)/f}
 g.putImageData(id,0,0);push();objs[objs.indexOf(o)]={...o,cv:c};sel=null;toast('Đã xóa màu đó — bấm tiếp màu khác hoặc nhấn Esc để thoát')}
function editText(o,p){
 const ta=document.createElement('textarea'),z=o?o.z:Math.max(18,size*4),x=(o?o.x:p.x)*view.s+view.x,y=(o?o.y:p.y)*view.s+view.y;
 ta.className='te';ta.value=o?o.s:'';ta.style.cssText+=`left:${x}px;top:${y}px;font:${z*view.s}px system-ui,sans-serif;color:${o?o.c:color};line-height:1.25`;
 if(o)o.hide=1;document.body.append(ta);rd();let done=0;
 const fin=ok=>{if(done)return;done=1;const s=ta.value;ta.remove();if(o)delete o.hide;
  if(ok){if(o){push();const i=objs.indexOf(o);if(s.trim())objs[i]={...o,s};else objs.splice(i,1)}else if(s.trim()){push();objs.push({t:'text',x:p.x,y:p.y,s,c:color,z})}}rd()};
 ta.onblur=()=>fin(1);ta.onkeydown=e=>{e.stopPropagation();if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();fin(1)}if(e.key=='Escape')fin(0)};
 setTimeout(()=>ta.focus(),0)}
function addImg(file){
 const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const c=toCv(im);URL.revokeObjectURL(u);let w=c.width,h=c.height;const k=Math.min(1,innerWidth*.6/view.s/w,innerHeight*.6/view.s/h);w*=k;h*=k;push();
  const o={t:'img',cv:c,x:(innerWidth/2-view.x)/view.s-w/2,y:(innerHeight/2-view.y)/view.s-h/2,w,h};objs.push(o);sel=o;setTool('select');toast('Đã dán ảnh. Nhấn Shift+T rồi bấm vào màu muốn xóa để tách nền.');rd()};
 im.src=u}
function zoomAt(f,cx,cy){const n=Math.min(8,Math.max(.1,view.s*f));f=n/view.s;view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.s=n;upd()}
function fit(){const b=allBB();if(!b){view={s:1,x:0,y:0};return upd()}const w=Math.max(1,b[2]-b[0]),h=Math.max(1,b[3]-b[1]),s=Math.min(4,(innerWidth-80)/w,(innerHeight-170)/h);view.s=s;view.x=(innerWidth-w*s)/2-b[0]*s;view.y=(innerHeight-100-h*s)/2-b[1]*s+10;upd()}
function exportPNG(){
 const b=allBB();if(!b)return toast('Bảng còn trống, chưa có gì để lưu');
 const pad=40,k=2,c=document.createElement('canvas');c.width=(b[2]-b[0]+pad*2)*k;c.height=(b[3]-b[1]+pad*2)*k;
 const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);g.setTransform(k,0,0,k,(pad-b[0])*k,(pad-b[1])*k);objs.forEach(o=>drawObj(g,o));
 const a=document.createElement('a');a.download='bang-ve.png';a.href=c.toDataURL('image/png');a.click()}

/* ---------- thanh công cụ ---------- */
function setTool(t){tool=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t));cv.className=t;hint.classList.remove('flash');hint.textContent=TOOLS.find(x=>x[0]==t)[3];rd()}
TOOLS.forEach(([id,ic,nm,tip])=>{const b=document.createElement('button');b.className='b';b.dataset.t=id;b.title=tip;b.innerHTML=`<i>${ic}</i><span>${nm}</span>`;b.onclick=()=>setTool(id);$('#tools').append(b)});
COLORS.forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.title=c;b.onclick=()=>setColor(c);$('#sws').append(b)});
function setColor(c){color=c;$('#col').value=c;document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.title==c))}
$('#col').oninput=e=>setColor(e.target.value);$('#sz').oninput=e=>size=+e.target.value;$('#tl').oninput=e=>tol=+e.target.value;
$('#zo').onclick=()=>zoomAt(1/1.25,innerWidth/2,innerHeight/2);$('#zi').onclick=()=>zoomAt(1.25,innerWidth/2,innerHeight/2);
$('#zl').onclick=()=>zoomAt(1/view.s,innerWidth/2,innerHeight/2);$('#fit').onclick=fit;
$('#un').onclick=und;$('#re').onclick=rdo;$('#gr').onclick=()=>{grid=!grid;rd()};$('#sv').onclick=exportPNG;
$('#cl').onclick=()=>{if(objs.length&&confirm('Xóa toàn bộ bảng vẽ?')){push();objs=[];sel=null;rd()}};

/* ---------- chuột / cảm ứng ---------- */
const pan=e=>drag={k:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};
cv.onpointerdown=e=>{
 e.preventDefault();if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();cv.setPointerCapture(e.pointerId);
 const p=W(e),r=8/view.s;
 if(e.button==1||space)pan(e);
 else if(tool=='pen')cur={t:'pen',pts:[[p.x,p.y]],c:color,w:size};
 else if(['ruler','rect','ell','arrow'].includes(tool))cur={t:tool=='ruler'?'line':tool,a:[p.x,p.y],b:[p.x,p.y],c:color,w:size,ruler:tool=='ruler'};
 else if(tool=='eraser'){push();drag={k:'er'};erase(p)}
 else if(tool=='select'){const o=topHit(p,r);sel=o||null;if(o)drag={k:'mv',x:p.x,y:p.y,pushed:0};else pan(e)}
 else if(tool=='text'){const o=topHit(p,r);editText(o&&o.t=='text'?o:null,p)}
 else if(tool=='zoom')zoomAt(e.altKey||e.shiftKey?1/1.5:1.5,e.clientX,e.clientY);
 else if(tool=='bucket')bucket(p,r);
 else if(tool=='chroma')chroma(p);
 rd()};
cv.onpointermove=e=>{
 const p=W(e);
 if(cur){if(cur.t=='pen')cur.pts.push([p.x,p.y]);else{let b=[p.x,p.y];if(cur.t=='line'||cur.t=='arrow'){if(cur.ruler||e.shiftKey)b=snap(cur.a,b,e.shiftKey)}cur.b=b}}
 else if(drag){
  if(drag.k=='pan'){view.x=drag.vx+e.clientX-drag.sx;view.y=drag.vy+e.clientY-drag.sy}
  else if(drag.k=='er')erase(p);
  else if(drag.k=='mv'&&sel){if(!drag.pushed){push();drag.pushed=1}move(sel,p.x-drag.x,p.y-drag.y);drag.x=p.x;drag.y=p.y}}
 rd()};
cv.onpointerup=cv.onpointercancel=()=>{
 if(cur){const c=cur;cur=null;if(c.t=='pen'||Math.hypot(c.b[0]-c.a[0],c.b[1]-c.a[1])>2){push();delete c.ruler;objs.push(c)}}
 drag=null;upd()};
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});

/* ---------- dán ảnh, kéo thả, phím tắt ---------- */
addEventListener('paste',e=>{for(const it of e.clipboardData.items)if(it.type.startsWith('image/')){addImg(it.getAsFile());e.preventDefault();break}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).forEach(addImg)});
addEventListener('keydown',e=>{
 if(e.target.tagName=='TEXTAREA')return;
 const k=e.key.toLowerCase();
 if(e.ctrlKey||e.metaKey){if(k=='z'){e.preventDefault();e.shiftKey?rdo():und()}else if(k=='y'){e.preventDefault();rdo()}else if(k=='s'){e.preventDefault();exportPNG()}return}
 if(k==' '){space=1;e.preventDefault();return}
 if(e.shiftKey&&k=='t'){setTool(tool=='chroma'?'select':'chroma');return}
 if(k=='delete'||k=='backspace'){if(sel){push();objs=objs.filter(o=>o!==sel);sel=null;rd()}return}
 if(k=='escape'){sel=null;setTool('select');return}
 const m={p:'pen',l:'ruler',r:'rect',o:'ell',a:'arrow',e:'eraser',v:'select',t:'text',b:'bucket',z:'zoom'};
 if(m[k])setTool(m[k]);else if(k=='g'){grid=!grid;rd()}else if(k=='f')fit()});
addEventListener('keyup',e=>{if(e.key==' ')space=0});
function rs(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;rd()}addEventListener('resize',rs);

/* ---------- khởi động: khôi phục bảng lần trước ---------- */
try{const d=JSON.parse(localStorage.getItem('wb')||'null');if(d){bg=d.bg||bg;(d.objs||[]).forEach(o=>{if(o.t=='img'){const src=o.cv;o.cv=null;const im=new Image();im.onload=()=>{o.cv=toCv(im);rd()};im.src=src}objs.push(o)})}}catch(e){}
setColor(color);rs();setTool('pen');upd();
</script>
